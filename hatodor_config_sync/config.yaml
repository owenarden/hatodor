name: "Hatodor Config Sync"
version: "0.2.1"
slug: "hatodor_config_sync"
description: >-
  Installs the Hatodor-managed Home Assistant package and ESPHome configuration
  into the Home Assistant configuration directory.
arch:
  - aarch64
  - amd64
startup: once
boot: auto
init: false
stage: experimental
backup: cold

map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant

options: {}
schema: {}
