name: "Hatodor Config Sync"
version: "0.9.0"
slug: "hatodor_config_sync"
description: >-
  Installs the Hatodor-managed Home Assistant packages and ESPHome configuration
  into the Home Assistant configuration directory.
arch:
  - aarch64
  - amd64
startup: once
boot: auto
init: false
stage: experimental
backup: cold
# Prebuilt by .github/workflows/publish-images.yml; Supervisor fills in {arch}
# and pulls the tag matching `version`.
image: "ghcr.io/owenarden/{arch}-hatodor-config-sync"

map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant

options:
  thecatapi_key: ""
schema:
  thecatapi_key: password
