# Home Assistant package for the reTerminal E1001 daily dashboard.
#
# Super Productivity projects:
#   Morning Routine -> todo.super_productivity_sp_morning_routine
#   Reminders       -> todo.super_productivity_sp_reminders
#   Evening Routine -> todo.super_productivity_sp_evening_routine
#
# Dashboard day:
#   04:00-10:00  Morning Routine
#   10:00-18:00  Reminders
#   18:00-04:00  Evening Routine
#
# The three times are Home Assistant helpers and can be adjusted in the UI.
# Their defaults are set only once so later changes survive restarts.

input_datetime:
  dashboard_daily_rollover:
    name: Dashboard daily rollover
    has_date: false
    has_time: true
    icon: mdi:calendar-refresh

  dashboard_morning_end:
    name: Dashboard morning routine ends
    has_date: false
    has_time: true
    icon: mdi:weather-sunset-up

  dashboard_evening_start:
    name: Dashboard evening routine starts
    has_date: false
    has_time: true
    icon: mdi:weather-sunset-down

input_boolean:
  dashboard_times_initialized:
    name: Dashboard times initialized
    icon: mdi:check-clock

input_text:
  dashboard_last_rollover_day:
    name: Dashboard last rollover day
    max: 10

script:
  morning_dashboard_get_items:
    alias: Dashboard - get active items
    description: >-
      Return both incomplete and completed items from the currently active
      Super Productivity project, together with the source entity, list name,
      and local-time deadline labels for timed due dates.
    mode: parallel
    sequence:
      - variables:
          now_time: "{{ now().strftime('%H:%M:%S') }}"
          rollover_time: "{{ states('input_datetime.dashboard_daily_rollover') }}"
          morning_end_time: "{{ states('input_datetime.dashboard_morning_end') }}"
          evening_start_time: "{{ states('input_datetime.dashboard_evening_start') }}"

      - variables:
          todo_entity: >-
            {% if now_time < rollover_time or now_time >= evening_start_time %}
              todo.super_productivity_sp_evening_routine
            {% elif now_time < morning_end_time %}
              todo.super_productivity_sp_morning_routine
            {% else %}
              todo.super_productivity_sp_reminders
            {% endif %}
          list_name: >-
            {% if now_time < rollover_time or now_time >= evening_start_time %}
              Evening Routine
            {% elif now_time < morning_end_time %}
              Morning Routine
            {% else %}
              Reminders
            {% endif %}

      - action: todo.get_items
        target:
          entity_id: "{{ todo_entity | trim }}"
        data:
          status:
            - needs_action
            - completed
        response_variable: todo_data

      - variables:
          source_entity: "{{ todo_entity | trim }}"
          deadline_labels: >-
            {% set ns = namespace(values=[]) %}
            {% for item in todo_data[source_entity]['items'] | default([]) %}
              {% if item['due'] is defined and item['due'] is not none
                    and (item['due'] | string | length) > 10 %}
                {% set local_due = as_local(as_datetime(item['due'])) %}
                {% set ns.values = ns.values + [local_due.strftime('%I:%M %p')] %}
              {% else %}
                {% set ns.values = ns.values + [''] %}
              {% endif %}
            {% endfor %}
            {{ ns.values }}
          dashboard_response:
            list_name: "{{ list_name | trim }}"
            todo_entity: "{{ source_entity }}"
            items: "{{ todo_data[source_entity]['items'] | default([]) }}"
            deadlines: "{{ deadline_labels }}"

      - stop: Return the active dashboard checklist
        response_variable: dashboard_response

  morning_dashboard_set_status:
    alias: Dashboard - set item status
    description: >-
      Update one item by UID. If todo_entity is provided, use the exact list
      that supplied the item; otherwise fall back to the currently active list.
    mode: parallel
    fields:
      uid:
        name: Item UID
        required: true
        selector:
          text:
      status:
        name: Status
        required: true
        selector:
          select:
            options:
              - needs_action
              - completed
      todo_entity:
        name: Source todo entity
        required: false
        selector:
          text:
    sequence:
      - variables:
          now_time: "{{ now().strftime('%H:%M:%S') }}"
          rollover_time: "{{ states('input_datetime.dashboard_daily_rollover') }}"
          morning_end_time: "{{ states('input_datetime.dashboard_morning_end') }}"
          evening_start_time: "{{ states('input_datetime.dashboard_evening_start') }}"

      - variables:
          active_todo_entity: >-
            {% if now_time < rollover_time or now_time >= evening_start_time %}
              todo.super_productivity_sp_evening_routine
            {% elif now_time < morning_end_time %}
              todo.super_productivity_sp_morning_routine
            {% else %}
              todo.super_productivity_sp_reminders
            {% endif %}
          target_todo_entity: "{{ todo_entity | default(active_todo_entity, true) | trim }}"

      - condition: template
        value_template: >-
          {{ target_todo_entity in [
            'todo.super_productivity_sp_morning_routine',
            'todo.super_productivity_sp_reminders',
            'todo.super_productivity_sp_evening_routine'
          ] }}

      - action: todo.update_item
        target:
          entity_id: "{{ target_todo_entity }}"
        data:
          item: "{{ uid }}"
          status: "{{ status }}"

  dashboard_reset_daily_deadlines:
    alias: Dashboard - reset daily deadlines
    description: >-
      Preserve each task's local deadline time while moving timed due dates into
      the new dashboard day. Deadlines before rollover belong to the following
      calendar date so post-midnight Evening tasks remain in the same dashboard day.
    mode: parallel
    fields:
      todo_entity:
        name: Todo entity
        required: true
        selector:
          text:
      rollover_day:
        name: Dashboard day
        required: true
        selector:
          text:
    sequence:
      - variables:
          target_todo_entity: "{{ todo_entity | trim }}"
          target_rollover_day: "{{ rollover_day | trim }}"
          rollover_time: "{{ states('input_datetime.dashboard_daily_rollover') }}"

      - condition: template
        value_template: >-
          {{ target_todo_entity in [
            'todo.super_productivity_sp_morning_routine',
            'todo.super_productivity_sp_reminders',
            'todo.super_productivity_sp_evening_routine'
          ] }}

      - action: todo.get_items
        target:
          entity_id: "{{ target_todo_entity }}"
        data:
          status:
            - needs_action
            - completed
        response_variable: deadline_items

      - repeat:
          for_each: >-
            {{ deadline_items[target_todo_entity]['items'] | default([]) }}
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ repeat.item['due'] is defined
                       and repeat.item['due'] is not none
                       and (repeat.item['due'] | string | length) > 10 }}
              then:
                - action: todo.update_item
                  target:
                    entity_id: "{{ target_todo_entity }}"
                  data:
                    item: "{{ repeat.item['uid'] }}"
                    due_datetime: >-
                      {% set local_due = as_local(as_datetime(repeat.item['due'])) %}
                      {% set due_time = local_due.strftime('%H:%M:%S') %}
                      {% set base_day = as_datetime(target_rollover_day) %}
                      {% if due_time < rollover_time %}
                        {{ (base_day + timedelta(days=1)).date().isoformat() }} {{ due_time }}
                      {% else %}
                        {{ target_rollover_day }} {{ due_time }}
                      {% endif %}

  dashboard_daily_rollover:
    alias: Dashboard - perform daily rollover
    description: >-
      Reopen completed Morning and Evening routine items for the new dashboard
      day, remove completed Reminders, and move every timed task deadline into
      the new dashboard day while preserving its local clock time.
    mode: single
    sequence:
      - variables:
          rollover_time: "{{ states('input_datetime.dashboard_daily_rollover') }}"
          now_time: "{{ now().strftime('%H:%M:%S') }}"

      - variables:
          rollover_day: >-
            {% if now_time < rollover_time %}
              {{ (now() - timedelta(days=1)).date().isoformat() }}
            {% else %}
              {{ now().date().isoformat() }}
            {% endif %}

      - action: todo.get_items
        target:
          entity_id: todo.super_productivity_sp_morning_routine
        data:
          status: completed
        response_variable: morning_completed

      - repeat:
          for_each: >-
            {{ morning_completed['todo.super_productivity_sp_morning_routine']['items']
               | default([]) }}
          sequence:
            - action: todo.update_item
              target:
                entity_id: todo.super_productivity_sp_morning_routine
              data:
                item: "{{ repeat.item['uid'] }}"
                status: needs_action

      - action: todo.get_items
        target:
          entity_id: todo.super_productivity_sp_evening_routine
        data:
          status: completed
        response_variable: evening_completed

      - repeat:
          for_each: >-
            {{ evening_completed['todo.super_productivity_sp_evening_routine']['items']
               | default([]) }}
          sequence:
            - action: todo.update_item
              target:
                entity_id: todo.super_productivity_sp_evening_routine
              data:
                item: "{{ repeat.item['uid'] }}"
                status: needs_action

      - action: todo.remove_completed_items
        target:
          entity_id: todo.super_productivity_sp_reminders

      - action: script.dashboard_reset_daily_deadlines
        data:
          todo_entity: todo.super_productivity_sp_morning_routine
          rollover_day: "{{ rollover_day | trim }}"

      - action: script.dashboard_reset_daily_deadlines
        data:
          todo_entity: todo.super_productivity_sp_reminders
          rollover_day: "{{ rollover_day | trim }}"

      - action: script.dashboard_reset_daily_deadlines
        data:
          todo_entity: todo.super_productivity_sp_evening_routine
          rollover_day: "{{ rollover_day | trim }}"

      - action: input_text.set_value
        target:
          entity_id: input_text.dashboard_last_rollover_day
        data:
          value: "{{ rollover_day | trim }}"

automation:
  - id: dashboard_daily_lifecycle
    alias: Dashboard - daily lifecycle
    description: >-
      Initialize dashboard times once, run the daily rollover at the configured
      time, and catch up if Home Assistant was offline when rollover occurred.
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.dashboard_daily_rollover
        id: scheduled
      - trigger: homeassistant
        event: start
        id: startup
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.dashboard_times_initialized
            state: "off"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dashboard_daily_rollover
            data:
              time: "04:00:00"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dashboard_morning_end
            data:
              time: "10:00:00"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dashboard_evening_start
            data:
              time: "18:00:00"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.dashboard_times_initialized

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'startup' }}"
        then:
          - delay: "00:00:02"

      - variables:
          rollover_time: "{{ states('input_datetime.dashboard_daily_rollover') }}"
          now_time: "{{ now().strftime('%H:%M:%S') }}"

      - variables:
          expected_rollover_day: >-
            {% if now_time < rollover_time %}
              {{ (now() - timedelta(days=1)).date().isoformat() }}
            {% else %}
              {{ now().date().isoformat() }}
            {% endif %}

      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.dashboard_last_rollover_day')
                 != (expected_rollover_day | trim) }}
        then:
          - action: script.dashboard_daily_rollover
