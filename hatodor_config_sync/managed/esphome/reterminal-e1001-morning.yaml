substitutions:
  device_name: reterminal-e1001-morning
  friendly_name: Daily Dashboard

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.10.0
  on_boot:
    priority: -100
    then:
      # ESPHome can connect before Home Assistant is ready to receive actions.
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
      - delay: 2s
      - script.execute: fetch_checklist

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    # Gives Home Assistant a convenient way to force a refresh immediately.
    - action: refresh_checklist
      then:
        - script.execute: fetch_checklist

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

font:
  - file: "gfonts://Inter@700"
    id: font_title
    size: 38
  - file: "gfonts://Inter@600"
    id: font_item
    size: 27
  - file: "gfonts://Inter@400"
    id: font_completed
    size: 27
  - file: "gfonts://Inter@400"
    id: font_small
    size: 18

qr_code:
  - id: assignment_qr
    value: "https://example.invalid/"
    ecc: MEDIUM

globals:
  - id: checklist_titles
    type: std::vector<std::string>
    restore_value: no

  - id: checklist_uids
    type: std::vector<std::string>
    restore_value: no

  - id: checklist_done
    type: std::vector<bool>
    restore_value: no

  - id: checklist_deadlines
    type: std::vector<std::string>
    restore_value: no

  - id: selected_index
    type: int
    restore_value: no
    initial_value: '-1'

  - id: checklist_changed
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: active_list_name
    type: std::string
    restore_value: no
    initial_value: '"Dashboard"'

  - id: active_todo_entity
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: pending_update_count
    type: int
    restore_value: no
    initial_value: '0'

  - id: green_seen_pulses
    type: int
    restore_value: no
    initial_value: '0'

  - id: qr_mode
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: qr_title
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: qr_url
    type: std::string
    restore_value: no
    initial_value: '""'

display:
  - platform: waveshare_epaper
    id: epaper_display

    # The E1001 panel supports ESPHome's V2 partial-refresh driver.
    # Use partial refreshes for normal interaction, with a full cleaning
    # refresh every 30 display updates to limit ghosting.
    model: 7.50inV2p
    full_update_every: 30

    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true

    # Only redraw on a meaningful change or a button press.
    update_interval: never

    lambda: |-
      it.fill(COLOR_OFF);

      const int width = 800;
      const int max_visible = 8;
      const int row_height = 43;
      const int first_row_y = 78;

      // Assignment detail view. The QR component is updated dynamically when
      // green is pressed on a Canvas row.
      if (id(qr_mode)) {
        std::string title = id(qr_title);
        if (title.size() > 44) {
          title = title.substr(0, 41) + "...";
        }

        it.printf(width / 2, 18, id(font_item), TextAlign::TOP_CENTER,
                  "%s", title.c_str());
        it.line(25, 60, 775, 60, COLOR_ON);

        const int modules = id(assignment_qr).get_size();
        int scale = modules > 0 ? 300 / modules : 4;
        if (scale < 2) scale = 2;
        if (scale > 8) scale = 8;
        const int qr_size = modules * scale;
        const int qr_x = (width - qr_size) / 2;
        const int qr_y = 78;
        it.qr_code(qr_x, qr_y, id(assignment_qr), COLOR_ON, scale);

        it.printf(width / 2, 398, id(font_small), TextAlign::TOP_CENTER,
                  "Scan to open Canvas");
        it.line(25, 430, 775, 430, COLOR_ON);
        it.printf(28, 442, id(font_small), "< / > back + select");
        it.printf(772, 442, id(font_small), TextAlign::TOP_RIGHT,
                  "GREEN = back");
        return;
      }

      const int total = id(checklist_titles).size();
      int done_count = 0;
      for (bool done : id(checklist_done)) {
        if (done) done_count++;
      }

      const bool daytime = id(active_list_name) == "Coming up";

      it.printf(28, 18, id(font_title), "%s", id(active_list_name).c_str());
      if (daytime) {
        it.printf(772, 27, id(font_small), TextAlign::TOP_RIGHT,
                  "%d items", total);
      } else {
        it.printf(772, 27, id(font_small), TextAlign::TOP_RIGHT,
                  "%d/%d done", done_count, total);
      }
      it.line(25, 66, 775, 66, COLOR_ON);

      if (total == 0) {
        it.printf(width / 2, 210, id(font_item), TextAlign::TOP_CENTER,
                  "Nothing on this list");
        it.printf(width / 2, 255, id(font_small), TextAlign::TOP_CENTER,
                  "Home Assistant / Super Productivity");
        return;
      }

      int selected = id(selected_index);
      if (selected < 0) selected = 0;
      if (selected >= total) selected = total - 1;

      int first = 0;
      if (total > max_visible) {
        first = selected - (max_visible / 2);
        if (first < 0) first = 0;
        if (first > total - max_visible) first = total - max_visible;
      }

      const int visible = std::min(total - first, max_visible);

      auto starts_with = [](const std::string &value, const char *prefix) {
        return value.rfind(prefix, 0) == 0;
      };

      auto section_for = [&](int i) -> std::string {
        if (!daytime || i < 0 || i >= total) return std::string();
        const std::string &uid = id(checklist_uids)[i];
        if (starts_with(uid, "canvas:urgent:")) return "NEEDS ATTENTION";
        if (id(checklist_done)[i]) return "COMPLETED";
        if (starts_with(uid, "canvas:upcoming:")) return "COMING UP";
        if (starts_with(uid, "canvas:completed:")) return "COMPLETED";
        return "REMINDERS";
      };

      for (int slot = 0; slot < visible; slot++) {
        const int i = first + slot;
        const int y = first_row_y + slot * row_height;
        const bool selected_row = (i == selected);
        const bool done = id(checklist_done)[i];
        const std::string &uid = id(checklist_uids)[i];
        const bool canvas_row = starts_with(uid, "canvas:");
        const bool urgent_row = starts_with(uid, "canvas:urgent:");
        const std::string deadline =
            i < (int) id(checklist_deadlines).size()
                ? id(checklist_deadlines)[i]
                : std::string();

        const std::string section = section_for(i);
        const bool show_section = daytime &&
            (slot == 0 || section != section_for(i - 1));
        const int text_y = show_section ? y + 15 : y + 5;
        const int status_y = show_section ? y + 27 : y + 19;

        if (show_section) {
          it.printf(92, y - 2, id(font_small), "%s", section.c_str());
        }

        // A compact chevron marks the selected row without boxing in the text.
        if (selected_row) {
          it.line(27, status_y - 9, 35, status_y - 1, COLOR_ON);
          it.line(35, status_y - 1, 27, status_y + 7, COLOR_ON);
          it.line(29, status_y - 9, 37, status_y - 1, COLOR_ON);
          it.line(37, status_y - 1, 29, status_y + 7, COLOR_ON);
        }

        const int status_x = 62;
        if (canvas_row && !done) {
          if (urgent_row) {
            it.circle(status_x, status_y, 10, COLOR_ON);
            it.printf(status_x, status_y - 10, id(font_small),
                      TextAlign::TOP_CENTER, "!");
          } else {
            // A tiny QR-like square distinguishes Canvas rows from toggleable
            // Super Productivity reminders.
            it.rectangle(status_x - 9, status_y - 9, 18, 18, COLOR_ON);
            it.filled_rectangle(status_x - 6, status_y - 6, 4, 4, COLOR_ON);
            it.filled_rectangle(status_x + 2, status_y - 6, 4, 4, COLOR_ON);
            it.filled_rectangle(status_x - 6, status_y + 2, 4, 4, COLOR_ON);
          }
        } else {
          // Checklist icon for Super Productivity rows and completed items.
          it.circle(status_x, status_y, 10, COLOR_ON);
          if (done) {
            it.line(status_x - 5, status_y, status_x - 1, status_y + 4, COLOR_ON);
            it.line(status_x - 1, status_y + 4, status_x + 6, status_y - 5, COLOR_ON);
            it.line(status_x - 5, status_y + 1, status_x - 1, status_y + 5, COLOR_ON);
            it.line(status_x - 1, status_y + 5, status_x + 6, status_y - 4, COLOR_ON);
          }
        }

        std::string title = id(checklist_titles)[i];
        const size_t max_chars = deadline.empty() ? 43 : 31;
        if (title.size() > max_chars) {
          title = title.substr(0, max_chars - 3) + "...";
        }

        // The panel is 1-bit, so use lighter typography rather than fake gray.
        if (done) {
          it.printf(92, text_y, id(font_completed), "%s", title.c_str());
        } else {
          it.printf(92, text_y, id(font_item), "%s", title.c_str());
        }

        if (!deadline.empty()) {
          it.printf(772, text_y + 5, id(font_small), TextAlign::TOP_RIGHT,
                    "%s", deadline.c_str());
        }
      }

      it.line(25, 430, 775, 430, COLOR_ON);
      it.printf(28, 442, id(font_small), "< / > select");

      const bool selected_canvas =
          selected >= 0 && selected < total &&
          starts_with(id(checklist_uids)[selected], "canvas:");
      it.printf(772, 442, id(font_small), TextAlign::TOP_RIGHT,
                selected_canvas ? "GREEN = open QR" : "GREEN = toggle + next");

      if (total > max_visible) {
        it.printf(400, 442, id(font_small), TextAlign::TOP_CENTER,
                  "%d of %d", selected + 1, total);
      }

sensor:
  # The classic Waveshare driver blocks the main loop during a refresh. A GPIO
  # binary sensor only preserves the latest edge across that blocked interval,
  # so quick repeated green presses can collapse into one event. Use the
  # interrupt-backed pulse counter in software mode instead: its ISR accumulates
  # every press, even while the display is busy. The longer software filter also
  # debounces the mechanical button.
  - platform: pulse_counter
    id: green_button_counter
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
    use_pcnt: false
    internal_filter: 20ms
    count_mode:
      rising_edge: DISABLE
      falling_edge: INCREMENT
    update_interval: 20ms
    internal: true
    total:
      id: green_button_total
      internal: true
      on_value:
        then:
          - lambda: |-
              const int current = static_cast<int>(x);
              if (current < id(green_seen_pulses)) {
                // Counter reset/wrap; resynchronize without synthesizing presses.
                id(green_seen_pulses) = current;
                return;
              }

              const int presses = current - id(green_seen_pulses);
              if (presses <= 0) return;
              id(green_seen_pulses) = current;

              // Any green press closes the QR detail view.
              if (id(qr_mode)) {
                id(qr_mode) = false;
                id(redraw_completion_batch)->execute();
                return;
              }

              const int n = id(checklist_titles).size();
              if (n == 0) return;

              for (int press = 0; press < presses; press++) {
                int i = id(selected_index);
                if (i < 0 || i >= n) i = 0;

                const std::string item_uid = id(checklist_uids)[i];

                // Canvas rows are informational. Green opens the assignment URL
                // as a QR code instead of attempting to update a todo item.
                if (item_uid.rfind("canvas:", 0) == 0) {
                  size_t url_pos = item_uid.find("https://");
                  if (url_pos == std::string::npos) {
                    url_pos = item_uid.find("http://");
                  }
                  if (url_pos != std::string::npos) {
                    id(qr_title) = id(checklist_titles)[i];
                    id(qr_url) = item_uid.substr(url_pos);
                    id(assignment_qr).set_value(id(qr_url));
                    id(qr_mode) = true;
                  }
                  break;
                }

                if (id(active_todo_entity).empty()) return;

                const std::string source_entity = id(active_todo_entity);
                const bool target_done = !id(checklist_done)[i];

                id(checklist_done)[i] = target_done;
                id(selected_index) = (i + 1) % n;
                id(pending_update_count)++;
                id(update_task_status)->execute(
                    item_uid, source_entity, target_done);
              }

              // Coalesce all presses observed in this interval into one redraw.
              id(redraw_completion_batch)->execute();

binary_sensor:
  # Seeed reTerminal E1001 white-button GPIOs:
  # GPIO4 right, GPIO5 left. Green GPIO3 is handled by pulse_counter above.
  - platform: gpio
    id: button_right
    name: "${friendly_name} Right Button"
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: |-
          if (id(qr_mode)) id(qr_mode) = false;
          const int n = id(checklist_titles).size();
          if (n == 0) return;
          if (id(selected_index) < 0) {
            id(selected_index) = 0;
          } else {
            id(selected_index) = (id(selected_index) + 1) % n;
          }
      - script.execute: redraw_display

  - platform: gpio
    id: button_left
    name: "${friendly_name} Left Button"
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: |-
          if (id(qr_mode)) id(qr_mode) = false;
          const int n = id(checklist_titles).size();
          if (n == 0) return;
          if (id(selected_index) < 0) {
            id(selected_index) = 0;
          } else {
            id(selected_index) = (id(selected_index) + n - 1) % n;
          }
      - script.execute: redraw_display

script:
  # Navigation should begin refreshing almost immediately.
  - id: redraw_display
    mode: restart
    then:
      - delay: 30ms
      - component.update: epaper_display

  # Green presses get a short idle window so several quick presses can be
  # collected into one e-paper refresh. Presses that occur during the blocking
  # display operation are retained by green_button_counter and applied afterward.
  - id: redraw_completion_batch
    mode: restart
    then:
      - delay: 180ms
      - component.update: epaper_display

  # Wait briefly after the last backend response before reconciling. This gives
  # the pulse counter time to drain any button edges captured while the display
  # or a previous callback had the main loop blocked.
  - id: reconcile_after_updates
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: 'return id(pending_update_count) == 0;'
          then:
            - script.execute: fetch_checklist

  # Home Assistant is deliberately hidden behind this wrapper script.
  # Do not let an authoritative poll overwrite optimistic local toggles while
  # one or more green-button updates are still in flight.
  - id: fetch_checklist
    mode: restart
    then:
      - if:
          condition:
            and:
              - api.connected:
                  state_subscription_only: true
              - lambda: 'return id(pending_update_count) == 0;'
          then:
            - homeassistant.action:
                action: script.dashboard_get_combined_items
                capture_response: true

                on_success:
                  - lambda: |-
                      JsonArrayConst items =
                          response["response"]["items"].as<JsonArrayConst>();
                      JsonArrayConst deadlines =
                          response["response"]["deadlines"].as<JsonArrayConst>();

                      if (items.isNull()) {
                        ESP_LOGW("dashboard", "Checklist response did not contain an items array");
                        id(checklist_changed) = false;
                        return;
                      }

                      const char *list_name =
                          response["response"]["list_name"] | "Dashboard";
                      const char *todo_entity =
                          response["response"]["todo_entity"] | "";

                      std::string new_list_name(list_name);
                      std::string new_todo_entity(todo_entity);
                      std::vector<std::string> new_titles;
                      std::vector<std::string> new_uids;
                      std::vector<bool> new_done;
                      std::vector<std::string> new_deadlines;

                      size_t raw_index = 0;
                      for (JsonObjectConst item : items) {
                        const char *summary = item["summary"] | "";
                        const char *uid = item["uid"] | "";
                        const char *status = item["status"] | "needs_action";
                        const char *deadline = "";
                        if (!deadlines.isNull() && raw_index < deadlines.size()) {
                          deadline = deadlines[raw_index] | "";
                        }
                        raw_index++;

                        if (uid[0] == '\0') continue;

                        new_titles.emplace_back(summary);
                        new_uids.emplace_back(uid);
                        new_done.emplace_back(std::string(status) == "completed");
                        new_deadlines.emplace_back(deadline);
                      }

                      int new_selection = id(selected_index);
                      if (new_titles.empty()) {
                        new_selection = -1;
                      } else if (new_selection < 0) {
                        new_selection = 0;
                      } else if (new_selection >= (int) new_titles.size()) {
                        new_selection = new_titles.size() - 1;
                      }

                      bool changed =
                          (new_list_name != id(active_list_name)) ||
                          (new_todo_entity != id(active_todo_entity)) ||
                          (new_titles != id(checklist_titles)) ||
                          (new_uids != id(checklist_uids)) ||
                          (new_done != id(checklist_done)) ||
                          (new_deadlines != id(checklist_deadlines)) ||
                          (new_selection != id(selected_index));

                      id(active_list_name) = std::move(new_list_name);
                      id(active_todo_entity) = std::move(new_todo_entity);
                      id(checklist_titles) = std::move(new_titles);
                      id(checklist_uids) = std::move(new_uids);
                      id(checklist_done) = std::move(new_done);
                      id(checklist_deadlines) = std::move(new_deadlines);
                      id(selected_index) = new_selection;
                      id(checklist_changed) = changed;

                  - if:
                      condition:
                        lambda: 'return id(checklist_changed);'
                      then:
                        - script.execute: redraw_display

                on_error:
                  - logger.log:
                      level: WARN
                      format: "Could not fetch the active checklist from Home Assistant"

  # One independent backend update per green press. Parallel mode lets a batch
  # of rapid presses reach HA/SP without serializing on previous round trips.
  - id: update_task_status
    mode: parallel
    max_runs: 16
    parameters:
      item_uid: string
      source_todo_entity: string
      target_done: bool
    then:
      - homeassistant.action:
          action: script.morning_dashboard_set_status
          data_template:
            status: "{{ status_value }}"
            uid: "{{ uid_value }}"
            todo_entity: "{{ entity_value }}"
          variables:
            status_value: |-
              return target_done
                  ? std::string("completed")
                  : std::string("needs_action");
            uid_value: |-
              return item_uid;
            entity_value: |-
              return source_todo_entity;

          on_success:
            - lambda: |-
                if (id(pending_update_count) > 0) {
                  id(pending_update_count)--;
                }
            - script.execute: reconcile_after_updates

          on_error:
            - lambda: |-
                // Revert only if this failed operation still matches the
                // locally displayed state. A later toggle of the same UID wins.
                for (size_t i = 0; i < id(checklist_uids).size(); i++) {
                  if (id(checklist_uids)[i] == item_uid &&
                      id(checklist_done)[i] == target_done) {
                    id(checklist_done)[i] = !target_done;
                    break;
                  }
                }
                if (id(pending_update_count) > 0) {
                  id(pending_update_count)--;
                }
            - script.execute: redraw_completion_batch
            - script.execute: reconcile_after_updates
            - logger.log:
                level: WARN
                format: "Home Assistant rejected a checklist toggle; restored previous state"

interval:
  # Polling keeps remote edits/completions and time-window list changes in sync.
  # fetch_checklist suppresses polls while optimistic button updates are pending.
  - interval: 30s
    then:
      - script.execute: fetch_checklist
