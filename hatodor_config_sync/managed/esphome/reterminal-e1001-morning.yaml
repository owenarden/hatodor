substitutions:
  device_name: reterminal-e1001-morning
  friendly_name: Daily Dashboard

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.10.0
  on_boot:
    priority: -100
    then:
      # ESPHome can connect before Home Assistant is ready to receive actions.
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
      - delay: 2s
      - script.execute: fetch_checklist

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    # Gives Home Assistant a convenient way to force a refresh immediately.
    - action: refresh_checklist
      then:
        - script.execute: fetch_checklist

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

font:
  - file: "gfonts://Inter@700"
    id: font_title
    size: 38
  - file: "gfonts://Inter@600"
    id: font_item
    size: 27
  - file: "gfonts://Inter@400"
    id: font_completed
    size: 27
  - file: "gfonts://Inter@400"
    id: font_small
    size: 18

globals:
  - id: checklist_titles
    type: std::vector<std::string>
    restore_value: no

  - id: checklist_uids
    type: std::vector<std::string>
    restore_value: no

  - id: checklist_done
    type: std::vector<bool>
    restore_value: no

  - id: selected_index
    type: int
    restore_value: no
    initial_value: '-1'

  - id: checklist_changed
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: active_list_name
    type: std::string
    restore_value: no
    initial_value: '"Dashboard"'

  - id: active_todo_entity
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: pending_uid
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: pending_todo_entity
    type: std::string
    restore_value: no
    initial_value: '""'

display:
  - platform: waveshare_epaper
    id: epaper_display

    # The E1001 panel supports ESPHome's V2 partial-refresh driver.
    # Use partial refreshes for normal interaction, with a full cleaning
    # refresh every 30 display updates to limit ghosting.
    model: 7.50inV2p
    full_update_every: 30

    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true

    # Only redraw on a meaningful change or a button press.
    update_interval: never

    lambda: |-
      it.fill(COLOR_OFF);

      const int width = 800;
      const int max_visible = 8;
      const int row_height = 43;
      const int first_row_y = 78;

      const int total = id(checklist_titles).size();
      int done_count = 0;
      for (bool done : id(checklist_done)) {
        if (done) done_count++;
      }

      it.printf(28, 18, id(font_title), "%s", id(active_list_name).c_str());
      it.printf(772, 27, id(font_small), TextAlign::TOP_RIGHT,
                "%d/%d done", done_count, total);
      it.line(25, 66, 775, 66, COLOR_ON);

      if (total == 0) {
        it.printf(width / 2, 210, id(font_item), TextAlign::TOP_CENTER,
                  "Nothing on this list");
        it.printf(width / 2, 255, id(font_small), TextAlign::TOP_CENTER,
                  "Home Assistant / Super Productivity");
        return;
      }

      int selected = id(selected_index);
      if (selected < 0) selected = 0;
      if (selected >= total) selected = total - 1;

      int first = 0;
      if (total > max_visible) {
        first = selected - (max_visible / 2);
        if (first < 0) first = 0;
        if (first > total - max_visible) first = total - max_visible;
      }

      const int visible = std::min(total - first, max_visible);

      for (int slot = 0; slot < visible; slot++) {
        const int i = first + slot;
        const int y = first_row_y + slot * row_height;
        const bool selected_row = (i == selected);
        const bool done = id(checklist_done)[i];

        // A compact chevron marks the selected row without boxing in the text.
        if (selected_row) {
          it.line(27, y + 10, 35, y + 18, COLOR_ON);
          it.line(35, y + 18, 27, y + 26, COLOR_ON);
          it.line(29, y + 10, 37, y + 18, COLOR_ON);
          it.line(37, y + 18, 29, y + 26, COLOR_ON);
        }

        // Draw checklist icons directly so they do not depend on font glyphs.
        const int status_x = 62;
        const int status_y = y + 19;
        it.circle(status_x, status_y, 10, COLOR_ON);
        if (done) {
          it.line(status_x - 5, status_y, status_x - 1, status_y + 4, COLOR_ON);
          it.line(status_x - 1, status_y + 4, status_x + 6, status_y - 5, COLOR_ON);
          it.line(status_x - 5, status_y + 1, status_x - 1, status_y + 5, COLOR_ON);
          it.line(status_x - 1, status_y + 5, status_x + 6, status_y - 4, COLOR_ON);
        }

        std::string title = id(checklist_titles)[i];
        constexpr size_t max_chars = 43;
        if (title.size() > max_chars) {
          title = title.substr(0, max_chars - 3) + "...";
        }

        // The panel is 1-bit, so use lighter typography rather than fake gray.
        if (done) {
          it.printf(92, y + 5, id(font_completed), "%s", title.c_str());
        } else {
          it.printf(92, y + 5, id(font_item), "%s", title.c_str());
        }
      }

      it.line(25, 430, 775, 430, COLOR_ON);
      it.printf(28, 442, id(font_small), "< / > select");
      it.printf(772, 442, id(font_small), TextAlign::TOP_RIGHT,
                "GREEN = done");

      if (total > max_visible) {
        it.printf(400, 442, id(font_small), TextAlign::TOP_CENTER,
                  "%d of %d", selected + 1, total);
      }

binary_sensor:
  # Seeed reTerminal E1001 button GPIOs:
  # GPIO3 green, GPIO4 right white, GPIO5 left white.
  - platform: gpio
    id: button_green
    name: "${friendly_name} Green Button"
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - script.execute: complete_selected

  - platform: gpio
    id: button_right
    name: "${friendly_name} Right Button"
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: |-
          const int n = id(checklist_titles).size();
          if (n == 0) return;
          if (id(selected_index) < 0) {
            id(selected_index) = 0;
          } else {
            id(selected_index) = (id(selected_index) + 1) % n;
          }
      - script.execute: redraw_display

  - platform: gpio
    id: button_left
    name: "${friendly_name} Left Button"
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: |-
          const int n = id(checklist_titles).size();
          if (n == 0) return;
          if (id(selected_index) < 0) {
            id(selected_index) = 0;
          } else {
            id(selected_index) = (id(selected_index) + n - 1) % n;
          }
      - script.execute: redraw_display

script:
  # Keep a tiny debounce so contact bounce/near-simultaneous presses can settle,
  # but let the e-paper driver's own refresh time dominate perceived latency.
  - id: redraw_display
    mode: restart
    then:
      - delay: 30ms
      - component.update: epaper_display

  # Home Assistant is deliberately hidden behind this wrapper script.
  # ESPHome receives the active list name/entity but does not know how HA chose it.
  - id: fetch_checklist
    mode: restart
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - homeassistant.action:
                action: script.morning_dashboard_get_items
                capture_response: true

                on_success:
                  - lambda: |-
                      JsonArrayConst items =
                          response["response"]["items"].as<JsonArrayConst>();

                      if (items.isNull()) {
                        ESP_LOGW("dashboard", "Checklist response did not contain an items array");
                        id(checklist_changed) = false;
                        return;
                      }

                      const char *list_name =
                          response["response"]["list_name"] | "Dashboard";
                      const char *todo_entity =
                          response["response"]["todo_entity"] | "";

                      std::string new_list_name(list_name);
                      std::string new_todo_entity(todo_entity);
                      std::vector<std::string> new_titles;
                      std::vector<std::string> new_uids;
                      std::vector<bool> new_done;

                      for (JsonObjectConst item : items) {
                        const char *summary = item["summary"] | "";
                        const char *uid = item["uid"] | "";
                        const char *status = item["status"] | "needs_action";

                        if (uid[0] == '\0') continue;

                        new_titles.emplace_back(summary);
                        new_uids.emplace_back(uid);
                        const bool completed = std::string(status) == "completed";
                        const bool optimistic =
                            !id(pending_uid).empty() && id(pending_uid) == uid;
                        new_done.emplace_back(completed || optimistic);
                      }

                      int new_selection = id(selected_index);
                      if (new_titles.empty()) {
                        new_selection = -1;
                      } else if (new_selection < 0) {
                        new_selection = 0;
                      } else if (new_selection >= (int) new_titles.size()) {
                        new_selection = new_titles.size() - 1;
                      }

                      bool changed =
                          (new_list_name != id(active_list_name)) ||
                          (new_todo_entity != id(active_todo_entity)) ||
                          (new_titles != id(checklist_titles)) ||
                          (new_uids != id(checklist_uids)) ||
                          (new_done != id(checklist_done)) ||
                          (new_selection != id(selected_index));

                      id(active_list_name) = std::move(new_list_name);
                      id(active_todo_entity) = std::move(new_todo_entity);
                      id(checklist_titles) = std::move(new_titles);
                      id(checklist_uids) = std::move(new_uids);
                      id(checklist_done) = std::move(new_done);
                      id(selected_index) = new_selection;
                      id(checklist_changed) = changed;

                  - if:
                      condition:
                        lambda: 'return id(checklist_changed);'
                      then:
                        - script.execute: redraw_display

                on_error:
                  - logger.log:
                      level: WARN
                      format: "Could not fetch the active checklist from Home Assistant"

  - id: complete_selected
    mode: single
    then:
      - lambda: |-
          id(pending_uid).clear();
          id(pending_todo_entity).clear();
          const int i = id(selected_index);
          if (i < 0 || i >= (int) id(checklist_uids).size()) return;

          #ifndef ESPHOME_LOG_LEVEL_NONE
          ESP_LOGD("dashboard", "Completing item %d", i);
          #endif

          // A second press on an already-completed item is intentionally a no-op.
          if (id(checklist_done)[i]) return;
          if (id(active_todo_entity).empty()) return;

          id(pending_uid) = id(checklist_uids)[i];
          id(pending_todo_entity) = id(active_todo_entity);

          // Give immediate local feedback. The HA/SP round trip happens after
          // this state change; on_error below rolls it back if the update fails.
          id(checklist_done)[i] = true;

      - if:
          condition:
            lambda: 'return !id(pending_uid).empty() && !id(pending_todo_entity).empty();'
          then:
            - script.execute: redraw_display
            - homeassistant.action:
                action: script.morning_dashboard_set_status
                data:
                  status: completed
                data_template:
                  uid: "{{ item_uid }}"
                  todo_entity: "{{ source_todo_entity }}"
                variables:
                  item_uid: |-
                    return id(pending_uid);
                  source_todo_entity: |-
                    return id(pending_todo_entity);

                on_success:
                  - lambda: |-
                      id(pending_uid).clear();
                      id(pending_todo_entity).clear();
                  # The HA update action refreshes the integration coordinator;
                  # fetch again shortly afterward to reconcile any other changes.
                  - delay: 100ms
                  - script.execute: fetch_checklist

                on_error:
                  - lambda: |-
                      for (size_t i = 0; i < id(checklist_uids).size(); i++) {
                        if (id(checklist_uids)[i] == id(pending_uid)) {
                          id(checklist_done)[i] = false;
                          break;
                        }
                      }
                      id(pending_uid).clear();
                      id(pending_todo_entity).clear();
                  - script.execute: redraw_display
                  - logger.log:
                      level: WARN
                      format: "Home Assistant rejected the checklist update; reverted local completion"

interval:
  # Polling keeps remote edits/completions and time-window list changes in sync.
  # The display is refreshed only when the returned list actually changed.
  - interval: 30s
    then:
      - script.execute: fetch_checklist
