name: Build and Smoke Test HAOS App

on:
  push:
    branches:
      - main
    paths:
      - "super_productivity_desktop/**"
      - ".github/workflows/build-app.yml"
  pull_request:
    paths:
      - "super_productivity_desktop/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: *"\([^"]*\)"/\1/p' super_productivity_desktop/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Super Productivity Desktop $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build HAOS app image
        uses: docker/build-push-action@v6
        with:
          context: ./super_productivity_desktop
          file: ./super_productivity_desktop/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: haos-super-productivity:test
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and verify GUI endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name sp-smoke \
            -p 5800:5800 \
            -p 3877:3877 \
            haos-super-productivity:test

          for attempt in $(seq 1 30); do
            running="$(docker inspect -f '{{.State.Running}}' sp-smoke 2>/dev/null || true)"
            if [ "$running" != "true" ]; then
              echo "Container exited during startup"
              docker logs sp-smoke || true
              exit 1
            fi

            if curl -fsS http://127.0.0.1:5800/ >/dev/null; then
              echo "noVNC endpoint is reachable"
              sleep 5
              test "$(docker inspect -f '{{.State.Running}}' sp-smoke)" = "true"
              curl -fsS http://127.0.0.1:5800/ >/dev/null
              echo "Container startup smoke test passed"
              exit 0
            fi

            sleep 2
          done

          echo "Timed out waiting for noVNC endpoint"
          docker logs sp-smoke || true
          exit 1

      - name: Show container logs
        if: always()
        shell: bash
        run: |
          docker logs sp-smoke 2>&1 || true
          docker rm -f sp-smoke >/dev/null 2>&1 || true
