name: Build HAOS App

on:
  push:
    branches:
      - main
    paths:
      - "super_productivity_desktop/**"
      - ".github/workflows/build-app.yml"
  pull_request:
    paths:
      - "super_productivity_desktop/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: *"\([^"]*\)"/\1/p' super_productivity_desktop/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Super Productivity Desktop $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build HAOS app image
        uses: docker/build-push-action@v6
        with:
          context: ./super_productivity_desktop
          file: ./super_productivity_desktop/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
