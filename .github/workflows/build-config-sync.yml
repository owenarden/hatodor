name: Build Hatodor Config Sync

on:
  push:
    branches:
      - main
    paths:
      - "hatodor_config_sync/**"
      - ".github/workflows/build-config-sync.yml"
  pull_request:
    paths:
      - "hatodor_config_sync/**"
      - ".github/workflows/build-config-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test cat MOTD renderer
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=10,<13"
          python -m unittest discover -s hatodor_config_sync/tests -p 'test_*.py'

      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: *"\([^"]*\)"/\1/p' hatodor_config_sync/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Config Sync image
        uses: docker/build-push-action@v6
        with:
          context: ./hatodor_config_sync
          file: ./hatodor_config_sync/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: hatodor-config-sync:test
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=amd64

      - name: Verify managed files and integration patches
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          app_data="$(mktemp -d)"
          printf '%s\n' '{"thecatapi_key":"test-secret-key"}' > \
            "$app_data/options.json"

          mkdir -p "$target/custom_components/super_productivity"
          cat > "$target/custom_components/super_productivity/coordinator.py" <<'PY'
          async def sample(self):
              status, tasks = await asyncio.gather(
                  self.api.async_get_status(),
                  self.api.async_get_tasks(),
              )
          PY

          cat > "$target/custom_components/super_productivity/todo.py" <<'PY'
          def parse(task):
              a = task.get("dueWithTime")
              b = task.get("dueDay")
              return a, b

          def create(task_data, value):
              task_data["dueWithTime"] = value
              task_data["dueDay"] = None

          def update(updates, value):
              updates["dueWithTime"] = value
              updates["dueDay"] = None
          PY

          docker run --rm \
            -v "$target:/homeassistant" \
            -v "$app_data:/data" \
            hatodor-config-sync:test

          cmp \
            hatodor_config_sync/managed/packages/morning_dashboard.yaml \
            "$target/packages/morning_dashboard.yaml"
          cmp \
            hatodor_config_sync/managed/packages/school_dashboard.yaml \
            "$target/packages/school_dashboard.yaml"
          cmp \
            hatodor_config_sync/managed/esphome/reterminal-e1001-morning.yaml \
            "$target/esphome/reterminal-e1001-morning.yaml"
          cmp \
            hatodor_config_sync/managed/hatodor/render_cat_motd.py \
            "$target/hatodor/render_cat_motd.py"
          cmp \
            hatodor_config_sync/managed/hatodor/cat_sayings.json \
            "$target/hatodor/cat_sayings.json"
          test "$(sudo cat "$target/hatodor/thecatapi_key")" = "test-secret-key"
          test "$(sudo stat -c '%a' "$target/hatodor/thecatapi_key")" = "600"

          grep -Fq 'dashboard_show_motd:' \
            "$target/packages/morning_dashboard.yaml"
          grep -Fq 'dashboard_show_cat_motd:' \
            "$target/packages/morning_dashboard.yaml"
          grep -Fq 'dashboard_render_cat_motd:' \
            "$target/packages/morning_dashboard.yaml"
          grep -Fq 'https://api.thecatapi.com/v1/images/search' \
            "$target/packages/morning_dashboard.yaml"
          grep -Fq 'dashboard_motd_image_url:' \
            "$target/packages/morning_dashboard.yaml"
          grep -Fq 'motd: "{{ base_response.motd }}"' \
            "$target/packages/school_dashboard.yaml"
          grep -Fq 'id(motd_dismissed_hash) = id(motd_hash);' \
            "$target/esphome/reterminal-e1001-morning.yaml"
          grep -Fq 'changed && !should_download_image;' \
            "$target/esphome/reterminal-e1001-morning.yaml"
          grep -Fq 'DEFAULT_CAT_PATH = "/cat/closeup"' \
            "$target/hatodor/render_cat_motd.py"
          grep -Fq 'PHOTO_CONTRAST = 1.4' \
            "$target/hatodor/render_cat_motd.py"
          grep -Fq 'draw_caption(image, saying)' \
            "$target/hatodor/render_cat_motd.py"
          grep -Fq 'action: script.dashboard_get_combined_items' \
            "$target/esphome/reterminal-e1001-morning.yaml"
          grep -Fq 'interval: 30s' \
            "$target/esphome/reterminal-e1001-morning.yaml"

          grep -Fq \
            'self.api.async_get_tasks(include_done=True),' \
            "$target/custom_components/super_productivity/coordinator.py"

          grep -Fq '"deadlineWithTime"' \
            "$target/custom_components/super_productivity/todo.py"
          grep -Fq '"deadlineDay"' \
            "$target/custom_components/super_productivity/todo.py"
          ! grep -Fq '"dueWithTime"' \
            "$target/custom_components/super_productivity/todo.py"
          ! grep -Fq '"dueDay"' \
            "$target/custom_components/super_productivity/todo.py"

          # A second run must be idempotent: it should not duplicate or further
          # modify either integration patch.
          coordinator_before="$(sha256sum "$target/custom_components/super_productivity/coordinator.py")"
          todo_before="$(sha256sum "$target/custom_components/super_productivity/todo.py")"
          sudo chmod a+w "$target/hatodor/cat_sayings.json"
          printf '%s\n' '{"dry":["My custom saying."]}' > \
            "$target/hatodor/cat_sayings.json"
          sayings_before="$(sha256sum "$target/hatodor/cat_sayings.json")"

          docker run --rm \
            -v "$target:/homeassistant" \
            -v "$app_data:/data" \
            hatodor-config-sync:test

          test "$(grep -Fc 'self.api.async_get_tasks(include_done=True),' \
            "$target/custom_components/super_productivity/coordinator.py")" -eq 1
          test "$coordinator_before" = \
            "$(sha256sum "$target/custom_components/super_productivity/coordinator.py")"
          test "$todo_before" = \
            "$(sha256sum "$target/custom_components/super_productivity/todo.py")"
          test "$sayings_before" = \
            "$(sha256sum "$target/hatodor/cat_sayings.json")"

      - name: Compile ESPHome configuration
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          cp \
            hatodor_config_sync/managed/esphome/reterminal-e1001-morning.yaml \
            "$target/dashboard.yaml"
          cp hatodor_config_sync/tests/secrets.yaml "$target/secrets.yaml"

          docker run --rm \
            -v "$target:/config" \
            ghcr.io/esphome/esphome:2025.12.0 \
            compile /config/dashboard.yaml
